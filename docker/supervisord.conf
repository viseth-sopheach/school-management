[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true

; ==============================================================================
; Laravel Queue Worker (Optional)
; ==============================================================================
; On Render Free plan, you cannot deploy a separate background worker for free.
; If you require background queue processing, you can uncomment this program.
; Note that this will consume memory/CPU from the same single 512MB container,
; and it will sleep when the Web Service sleeps.
; If disabled, set QUEUE_CONNECTION=sync in your environment variables.
;
; [program:laravel-worker]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
; autostart=true
; autorestart=true
; stopasgroup=true
; killasgroup=true
; numprocs=1
; redirect_stderr=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
